# ====================================================================
# Cloud-Based Student Management System - Kubernetes Deployment
# Contains: Namespace, ConfigMap, Secret, PVC, DB & App Deployments, Services
# ====================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: student-system
  labels:
    app.kubernetes.io/name: student-management-system
    app.kubernetes.io/part-of: cloud-project

---
# 1. ConfigMap for Application Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: student-app-config
  namespace: student-system
data:
  PORT: "5000"
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "student_db"

---
# 2. Secret for Database Credentials (postgres / postgres123)
apiVersion: v1
kind: Secret
metadata:
  name: student-app-secret
  namespace: student-system
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres123"

---
# 3. PersistentVolumeClaim for Database Persistence
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: student-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
# 4. PostgreSQL Database Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  namespace: student-system
  labels:
    app: postgres-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-db
  template:
    metadata:
      labels:
        app: postgres-db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: student-app-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: student-app-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: student-app-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U postgres -d student_db
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U postgres -d student_db
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc

---
# 5. Service for PostgreSQL (Internal ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: student-system
  labels:
    app: postgres-db
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app: postgres-db

---
# 6. Student Management Application Deployment (High Availability: 2 Replicas)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-app-deployment
  namespace: student-system
  labels:
    app: student-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: student-app
  template:
    metadata:
      labels:
        app: student-app
    spec:
      containers:
        - name: student-app
          image: student-management-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: student-app-config
            - secretRef:
                name: student-app-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2

---
# 7. Service for Student Management Application (Exposed via NodePort & LoadBalancer)
apiVersion: v1
kind: Service
metadata:
  name: student-app-service
  namespace: student-system
  labels:
    app: student-app
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30080
      protocol: TCP
      name: http
  selector:
    app: student-app
